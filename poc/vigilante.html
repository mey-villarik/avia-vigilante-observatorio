<title>ORBITA Vigilante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de vistas + tablero de paneles en rejilla de 12 columnas (movibles) + asistente acoplable a la derecha.
   Dirección: noche andina (azul profundo), oro para oportunidades, celeste Titicaca como acento, franja de aguayo como firma. */
:root{
  --bg:#0A131E; --surface:#101C2A; --surface2:#162536; --raise:#1B2D41; --line:#22364B; --line2:#2E4660;
  --ink:#E7EDF4; --muted:#8C9EB3; --faint:#62758B;
  --accent:#7BC4E8; --accent-ink:#06202E; --accent-soft:rgba(123,196,232,.14);
  --opp:#E4BE6A; --opp-soft:rgba(228,190,106,.14);
  --risk:#EE6B62; --risk-soft:rgba(238,107,98,.14);
  --mix:#B79CF5; --mix-soft:rgba(183,156,245,.15);
  --ok:#46C285; --ok-soft:rgba(70,194,133,.14);
  --warn:#F29445; --warn-soft:rgba(242,148,69,.15);
  --crit:#F0605A; --crit-soft:rgba(240,96,90,.16);
  --unk:#8D9AAE; --unk-soft:rgba(141,154,174,.15);
  --mant:#8E9BF5; --mant-soft:rgba(142,155,245,.14);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --f-display:'Newsreader',Georgia,'Times New Roman',serif;
  --f-body:'Onest','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --fs:1;
  --bo-red:#D52B1E; --bo-yel:#F4D21A; --bo-grn:#007A3D;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F0F3F7; --raise:#E8EDF3; --line:#DAE1EA; --line2:#C6D0DC;
    --ink:#132131; --muted:#56677C; --faint:#7D8B9C;
    --accent:#1B6C9E; --accent-ink:#FFFFFF; --accent-soft:rgba(27,108,158,.10);
    --opp:#966708; --opp-soft:rgba(150,103,8,.10);
    --risk:#BF3A30; --risk-soft:rgba(191,58,48,.09);
    --mix:#6A4BC0; --mix-soft:rgba(106,75,192,.10);
    --ok:#1D8752; --ok-soft:rgba(29,135,82,.10);
    --warn:#B45C0D; --warn-soft:rgba(180,92,13,.11);
    --crit:#C42E27; --crit-soft:rgba(196,46,39,.10);
    --unk:#66748A; --unk-soft:rgba(102,116,138,.12);
    --mant:#4F5CC4; --mant-soft:rgba(79,92,196,.10);
    --shadow:0 16px 40px rgba(20,40,70,.16);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F0F3F7; --raise:#E8EDF3; --line:#DAE1EA; --line2:#C6D0DC;
  --ink:#132131; --muted:#56677C; --faint:#7D8B9C;
  --accent:#1B6C9E; --accent-ink:#FFFFFF; --accent-soft:rgba(27,108,158,.10);
  --opp:#966708; --opp-soft:rgba(150,103,8,.10);
  --risk:#BF3A30; --risk-soft:rgba(191,58,48,.09);
  --mix:#6A4BC0; --mix-soft:rgba(106,75,192,.10);
  --ok:#1D8752; --ok-soft:rgba(29,135,82,.10);
  --warn:#B45C0D; --warn-soft:rgba(180,92,13,.11);
  --crit:#C42E27; --crit-soft:rgba(196,46,39,.10);
  --unk:#66748A; --unk-soft:rgba(102,116,138,.12);
  --mant:#4F5CC4; --mant-soft:rgba(79,92,196,.10);
  --shadow:0 16px 40px rgba(20,40,70,.16);
  color-scheme:light;
}
:root[data-contrast="alto"]{ --muted:var(--ink); --faint:var(--ink); --line:var(--line2); }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(14px * var(--fs));line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── Shell ───────── */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px}
.brand-mark{width:38px;height:38px;color:var(--opp);flex:none}
.brand-name{font-family:var(--f-display);font-size:22px;font-weight:500;letter-spacing:.02em;line-height:1}
.brand-name i{color:var(--opp);font-weight:400}
.brand-cap .bo{display:inline-flex;gap:2px;margin-right:6px;vertical-align:middle}.brand-cap .bo i{width:8px;height:8px;border-radius:2px}
.brand-cap{font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.side-label{font-size:10.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--raise);border-color:var(--line2);color:var(--ink);box-shadow:inset 3px 0 0 var(--bo-red)}
.nav button.on svg{color:var(--opp)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.nav .count.hot{color:var(--crit)}
.views-list{display:flex;flex-direction:column;gap:2px}
.views-list button{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;border:none;background:none;color:var(--muted);text-align:left;font-size:13px}
.views-list button:hover{background:var(--surface2);color:var(--ink)}
.views-list button.on{color:var(--ink)}
.views-list button .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.views-list button.on .dot{background:var(--opp)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.demo-card{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
.demo-card strong{display:block;color:var(--opp);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.role{display:flex;flex-direction:column;gap:6px}
.role label{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;padding:0 2px}
select,.inp{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.flag{display:flex;height:5px}.flag i{flex:1}.flag i:nth-child(1){background:var(--bo-red)}.flag i:nth-child(2){background:var(--bo-yel)}.flag i:nth-child(3){background:var(--bo-grn)}
.aguayo{height:3px;background:repeating-linear-gradient(90deg,var(--risk) 0 18px,var(--opp) 18px 30px,var(--accent) 30px 44px,var(--ok) 44px 52px,var(--mix) 52px 66px,var(--opp) 66px 72px);opacity:.85}
.crumb{display:flex;gap:8px;align-items:baseline;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:0}
.crumb strong{color:var(--ink);font-weight:600}
.icon-btn.menu-btn{display:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.health{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:12px}
.health .lbl{color:var(--muted);letter-spacing:.06em;margin-right:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-OK{color:var(--ok);background:var(--ok-soft)}
.st-WARN{color:var(--warn);background:var(--warn-soft)}
.st-CRIT{color:var(--crit);background:var(--crit-soft)}
.st-UNKNOWN{color:var(--unk);background:var(--unk-soft)}
.st-MANT{color:var(--mant);background:var(--mant-soft);border-style:dashed;border-color:var(--mant)}
.nat-oportunidad{color:var(--opp);background:var(--opp-soft)}
.nat-riesgo{color:var(--risk);background:var(--risk-soft)}
.nat-mixta{color:var(--mix);background:var(--mix-soft)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--opp);color:#1D1404;border-color:var(--opp)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px}
.kbd{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--faint)}

.content{padding-block:22px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.content.with-chat{padding-right:max(20px,env(safe-area-inset-right,0px))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--opp);font-weight:600;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:24px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--bo-red) 0 33%,var(--bo-yel) 33% 66%,var(--bo-grn) 66%)}
h1{font-family:var(--f-display);font-weight:500;font-size:calc(34px * var(--fs));line-height:1.1;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h1 em{color:var(--opp);font-weight:400}
.sub{color:var(--muted);max-width:68ch;margin:0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.updated{font-size:12px;color:var(--faint)}

/* ───────── Tablero ───────── */
.edit-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;font-size:13px}
.edit-bar strong{color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.panel{grid-column:span var(--w,4);background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;display:flex;flex-direction:column;transition:border-color .15s, transform .15s}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;min-width:0}
.panel-h h2 svg{width:17px;height:17px;color:var(--opp);flex:none}
.panel-h .meta{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.panel-b{padding:14px 16px;min-width:0}
.panel-tools{display:none;margin-left:auto;gap:4px}
.editing .panel-tools{display:flex}
.editing .panel-h .meta{display:none}
.editing .panel{border-style:dashed;border-color:var(--line2)}
.editing .panel:hover{border-color:var(--accent)}
.panel-tools button{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.panel-tools button:hover{color:var(--ink);border-color:var(--accent)}
.panel-tools button svg{width:15px;height:15px}
.grip{display:none;cursor:grab;color:var(--faint)}
.editing .grip{display:block}
.panel.dragging{opacity:.4}
.panel.drop-before{box-shadow:-4px 0 0 0 var(--accent)}
.panel.drop-after{box-shadow:4px 0 0 0 var(--accent)}
.add-tile{grid-column:span 4;border:1.5px dashed var(--line2);border-radius:16px;min-height:120px;display:grid;place-items:center;color:var(--muted);background:none;gap:6px;padding:18px}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}

/* Síntesis */
.synth{display:flex;flex-direction:column;gap:12px}
.synth blockquote{margin:0;padding-left:14px;border-left:2px solid var(--opp);font-family:var(--f-display);font-size:calc(21px * var(--fs));line-height:1.3;text-wrap:balance}
.synth p{margin:0;color:var(--muted);max-width:70ch}
.synth p b{color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:calc(28px * var(--fs));line-height:1.15}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}

/* Pulso */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gauge svg{width:118px;height:118px}
.gauge .lab{font-size:12px;color:var(--muted)}
.gauge .lv{font-family:var(--f-display);font-size:16px}
.scale{margin-top:12px}
.scale-bar{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--ok),var(--opp),var(--warn),var(--crit));position:relative}
.scale-bar i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:5px}

/* Matriz de fuentes */
.src-matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.src-chip{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);text-align:left}
.src-chip:hover{border-color:var(--line2)}
.src-chip .n{font-size:12.5px;font-weight:600;line-height:1.25}
.src-chip .r{display:flex;justify-content:space-between;align-items:center;gap:6px}
.src-chip .t{font-size:11px;color:var(--faint)}
.histo{display:flex;gap:2px;height:14px;align-items:stretch}
.histo i{flex:1;border-radius:2px;min-width:2px}
.h-OK{background:var(--ok)} .h-WARN{background:var(--warn)} .h-CRIT{background:var(--crit)} .h-UNKNOWN{background:var(--unk)} .h-MANT{background:var(--mant);opacity:.5}

/* Cadena */
.chain{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;position:relative}
.chain::before{content:"";position:absolute;left:24px;right:24px;top:22px;border-top:1.5px dashed var(--line2)}
.link{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;text-align:center}
.link .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line2)}
.link .ic svg{width:19px;height:19px}
.link b{font-family:var(--f-display);font-weight:500;font-size:calc(24px * var(--fs));line-height:1.1}
.link small{font-size:11.5px;color:var(--muted);line-height:1.25}
.chain-note{margin-top:12px;font-size:12px;color:var(--muted);padding:9px 11px;border-radius:9px;background:var(--surface2)}

/* Listas de señales */
.sig-list{display:flex;flex-direction:column}
.sig{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.sig:last-child{border-bottom:none}
.sig:hover .sig-t{color:var(--accent)}
.bar{border-radius:3px}
.bar.alta{background:var(--crit)} .bar.media{background:var(--warn)} .bar.baja{background:var(--accent)}
.bar.oportunidad{background:var(--opp)}
.sig-t{font-weight:600;line-height:1.35;margin-bottom:4px}
.sig-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.sig-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.score{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Mapa */
.bomap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,58px);gap:6px}
.dep{border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;min-width:0}
.dep:hover{border-color:var(--accent)}
.dep .dn{font-size:12px;font-weight:600;line-height:1.15}
.dep .dc{display:flex;gap:8px;font-family:var(--f-mono);font-size:11px}
.dep .dc .o{color:var(--opp)} .dep .dc .r{color:var(--risk)}
.dep .heat{position:absolute;inset:0;pointer-events:none}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.map-legend span{display:inline-flex;gap:5px;align-items:center}
.map-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* Gráfica */
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.chart-legend span{display:inline-flex;gap:6px;align-items:center}
.chart-legend i{width:10px;height:3px;border-radius:2px}
.chart svg{width:100%;height:auto}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:10px}
.chart-note{font-size:11.5px;color:var(--faint);margin-top:6px}

/* Actividad */
.events{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.ev:last-child{border-bottom:none}
.ev time{font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.ev .what{min-width:0}
.ev .what small{display:block;color:var(--muted);font-size:11.5px}

/* Temas */
.topics{display:flex;flex-direction:column;gap:10px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.topic .tn{font-size:13px;font-weight:500;line-height:1.3}
.topic .tv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.topic .tb{grid-column:1/-1;height:5px;border-radius:5px;background:var(--surface2);overflow:hidden}
.topic .tb i{display:block;height:100%;border-radius:5px}
.up{color:var(--ok)} .down{color:var(--risk)}

/* Barras */
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px}
.hb .track{height:10px;border-radius:3px;background:var(--surface2);display:flex;overflow:hidden}
.hb .track i{display:block;height:100%}
.hb .v{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted)}

/* Decisiones */
.dec{display:flex;flex-direction:column;gap:10px}
.dec-item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.dec-item .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dec-item .tt{font-weight:600;line-height:1.35}
.sla{font-family:var(--f-mono);font-size:11.5px;color:var(--warn)}
.dec-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ───────── Fuentes (estilo Nagios) ───────── */
.nag-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.nag-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.nag-box b{font-family:var(--f-display);font-size:calc(30px * var(--fs));font-weight:500;line-height:1.1}
.nag-box small{font-size:12px;color:var(--muted)}
.nag-box.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.nag-box.st-OK,.nag-box.st-WARN,.nag-box.st-CRIT,.nag-box.st-UNKNOWN,.nag-box.st-MANT{background:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:920px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
td .srcname{font-weight:600}
td .srcurl{font-family:var(--f-mono);font-size:11px;color:var(--faint);word-break:break-all}
td .info{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);max-width:340px}
.ack{font-size:11px;color:var(--accent)}
.flap{font-size:11px;color:var(--mix)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;min-width:200px;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:none;background:none;padding:7px 11px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}

/* ───────── Señales (tubería) ───────── */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.stage-h{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stage-h b{font-family:var(--f-mono);color:var(--ink)}
.stage-b{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.stage.drop{border-color:var(--accent);background:var(--accent-soft)}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:7px;width:100%}
.card:hover{border-color:var(--line2)}
.card .ct{font-weight:600;font-size:13px;line-height:1.35}
.card .cm{display:flex;gap:5px;flex-wrap:wrap}
.card .cf{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.card[draggable="true"]{cursor:grab}

/* Oportunidades */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opp .ot{font-family:var(--f-display);font-size:calc(19px * var(--fs));line-height:1.25;font-weight:500;text-wrap:balance}
.opp .od{color:var(--muted);font-size:13px;margin:0}
.countdown{display:flex;align-items:baseline;gap:6px}
.countdown b{font-family:var(--f-display);font-size:30px;font-weight:500;color:var(--opp);line-height:1}
.countdown small{color:var(--muted);font-size:12px}
.actors{display:flex;gap:5px;flex-wrap:wrap}
.propose{border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.propose b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}

/* Análisis */
.an-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.an-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.an-type{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--surface2);display:flex;flex-direction:column;gap:3px}
.an-type b{font-size:13px}
.an-type small{font-size:11.5px;color:var(--muted);line-height:1.35}
.an-type.on{border-color:var(--opp);box-shadow:inset 0 0 0 1px var(--opp)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.out{white-space:pre-wrap;line-height:1.6;font-size:calc(14px * var(--fs))}
.out h3,.out h4{font-family:var(--f-display);font-weight:500;margin:14px 0 4px}
.eval{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.eval div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.eval small{display:block;font-size:11px;color:var(--muted)}
.eval b{font-family:var(--f-mono);font-size:15px}
.note{font-size:12px;color:var(--faint)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(3,8,14,.55);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:80;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.drawer-h .icon-btn{margin-left:auto}
.drawer-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.drawer-b h2{font-family:var(--f-display);font-weight:500;font-size:calc(25px * var(--fs));line-height:1.2;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl div{background:var(--surface2);border-radius:10px;padding:9px 11px}
.dl small{display:block;font-size:11px;color:var(--muted)}
.dl b{font-weight:600;font-size:13.5px}
.sect{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:4px}
.evi{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.evi svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--ok)}
.evi.pend svg{color:var(--warn)}
.evi small{display:block;color:var(--faint);font-family:var(--f-mono);font-size:11px;word-break:break-all}
.sol{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--opp-soft);border:1px solid transparent;cursor:pointer;align-items:flex-start}
.sol input{margin-top:4px;accent-color:var(--opp)}
.sol b{display:block;font-size:13.5px}
.sol small{color:var(--muted);font-size:12.5px}
.lock{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.check small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* Búsqueda */
.search{position:fixed;inset:0;z-index:90;display:grid;place-items:start center;padding:12vh 16px 16px;background:rgba(3,8,14,.55)}
.search-box{width:min(620px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.search-top{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.search-top input{border:none;background:none;outline:none;flex:1;font-size:16px}
.search-res{max-height:50vh;overflow-y:auto;padding:6px}
.sres{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;border:none;background:none;text-align:left}
.sres:hover,.sres.on{background:var(--surface2)}
.sres small{display:block;color:var(--muted);font-size:12px}
.sres .k{margin-left:auto;font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}

/* Catálogo de paneles */
.catalog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-item{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);text-align:left}
.cat-item b{font-size:13.5px;display:flex;gap:7px;align-items:center}
.cat-item b svg{width:16px;height:16px;color:var(--opp)}
.cat-item small{color:var(--muted);font-size:12px;line-height:1.35}
.cat-item.in{opacity:.55}
.cat-item.in b::after{content:"en el tablero";margin-left:auto;font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:.06em}

/* Asistente */
.chat-fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:9px;padding:11px 16px 11px 12px;border-radius:999px;border:1px solid var(--opp);background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.chat-fab .av{width:28px;height:28px}
.chat{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100% - 32px));height:min(640px,calc(100% - 100px));z-index:55;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat.docked{top:calc(env(safe-area-inset-top,0px) + 70px);height:auto}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none}
.chat-h .av{width:32px;height:32px;flex:none}
.chat-h b{display:block;font-size:14px}
.chat-h small{display:block;font-size:11.5px;color:var(--muted)}
.chat-h .tools{margin-left:auto;display:flex;gap:4px}
.chat-h .tools .icon-btn{width:30px;height:30px}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.5;font-size:calc(13.5px * var(--fs));white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--faint);font-size:11.5px;padding:2px}
.msg .act{display:block;margin-top:6px;font-size:11.5px;color:var(--opp)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--opp)}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:10px}
.chat-f textarea{flex:1;min-height:42px;max-height:120px;resize:none;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode-note{font-size:11px;color:var(--faint);padding:0 14px 8px}

/* Avisos */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{pointer-events:auto;background:var(--raise);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center}
.toast svg{width:16px;height:16px;color:var(--ok);flex:none}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;margin-top:6px}

/* Modo sencillo */
.simple .tech{display:none!important}

@media (max-width:1180px){
  .panel{grid-column:span max(6, var(--w,4))}
  .panel[style*="--w:12"]{grid-column:span 12}
  .nag-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .an-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .icon-btn.menu-btn{display:inline-grid}
  .chat-fab span.fl{display:none}
  .top-in{gap:8px}
  .panel,.add-tile{grid-column:span 12!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .health .lbl{display:none}
  h1{font-size:calc(27px * var(--fs))}
  .catalog,.an-types{grid-template-columns:1fr}
  .nag-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-right .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live .d{animation:pulse 1.8s infinite}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.flash{animation:flash 1.6s ease-out}
</style>

      <button class="icon-btn" id="chatClear" aria-label="Nueva conversación" title="Nueva conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
      <button class="icon-btn" id="chatClose" aria-label="Cerrar asistente" title="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>

function catBars(list){
 const rows=Object.keys(CATS).map(k=>{const ss=list.filter(s=>s.categoria===k);return {k,o:ss.filter(s=>s.naturaleza==='oportunidad').length,r:ss.filter(s=>s.naturaleza==='riesgo').length,m:ss.filter(s=>s.naturaleza==='mixta').length}}).filter(r=>r.o+r.r+r.m);
 const max=Math.max(1,...rows.map(r=>r.o+r.r+r.m));
 return `<div class="chart-legend"><span><i style="background:var(--opp)"></i>Oportunidad</span><span><i style="background:var(--risk)"></i>Riesgo</span><span><i style="background:var(--mix)"></i>Mixta</span></div><div class="hbars">${rows.map(r=>`<div class="hb"><span>${CATS[r.k]}</span><span class="track" role="img" aria-label="${CATS[r.k]}: ${r.o} oportunidades, ${r.r} riesgos, ${r.m} mixtas" style="width:${(r.o+r.r+r.m)/max*100}%"><i style="flex:${r.o};background:var(--opp)"></i><i style="flex:${r.r};background:var(--risk)"></i><i style="flex:${r.m};background:var(--mix)"></i></span><span class="v">${r.o+r.r+r.m}</span></div>`).join('')}</div>`;

function lineChart(){
 const W=640,H=200,L=30,R=12,T=12,B=24,max=45;

 const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 const area=path(SERIES.det)+` L${x(SERIES.det.length-1)},${H-B} L${L},${H-B} Z`;
 const grid=[0,15,30,45].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
 const lab=SERIES.labels.map((l,i)=>i%2===0||i===SERIES.labels.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('');

function wireBoard(){
 const board=$('board');if(!board)return;let dragId=null;
 board.querySelectorAll('[data-grip]').forEach(g=>{
  g.addEventListener('dragstart',e=>{dragId=g.dataset.grip;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch{}const p=g.closest('.panel');e.dataTransfer.setDragImage&&e.dataTransfer.setDragImage(p,20,20);setTimeout(()=>p.classList.add('dragging'),0)});
  g.addEventListener('dragend',()=>{board.querySelectorAll('.panel').forEach(p=>p.classList.remove('dragging','drop-before','drop-after'));dragId=null});
 });
 board.querySelectorAll('.panel').forEach(p=>{
  p.addEventListener('dragover',e=>{if(!dragId||p.dataset.panel===dragId)return;e.preventDefault();const r=p.getBoundingClientRect();const after=(e.clientX-r.left)>r.width/2;p.classList.toggle('drop-after',after);p.classList.toggle('drop-before',!after)});
  p.addEventListener('dragleave',()=>p.classList.remove('drop-before','drop-after'));
  p.addEventListener('drop',e=>{e.preventDefault();if(!dragId)return;const after=p.classList.contains('drop-after');const from=S.layout.findIndex(x=>x.id===dragId);const [item]=S.layout.splice(from,1);let to=S.layout.findIndex(x=>x.id===p.dataset.panel);if(after)to++;S.layout.splice(to,0,item);saveLayout();render();toast('Panel movido.')});
 });
}

function checksFor(s){
 const st=s.estado;const m=(a,b,c)=>st==='CRIT'?c:st==='WARN'?b:a;
 if(st==='MANT') return [['MANT','Disponibilidad','En mantenimiento programado'],['MANT','Frescura','—'],['MANT','Estructura','—'],['MANT','Novedad','—']];
 if(st==='UNKNOWN') return [['UNKNOWN','Disponibilidad','Sin datos: URL por confirmar'],['UNKNOWN','Frescura','—'],['UNKNOWN','Estructura','—'],['UNKNOWN','Novedad','—']];
 return [
  [s.id==='abc_caminos'?'CRIT':s.lat>5000?'WARN':'OK','Disponibilidad',s.id==='abc_caminos'?'Sin respuesta en 30 s (3/3)':`HTTP 200 en ${(s.lat/1000).toFixed(1)} s`],
  [s.id==='abc_caminos'?'CRIT':'OK','Frescura',s.id==='abc_caminos'?'Último dato hace 48 min (umbral 45)':'Último elemento dentro del plazo'],
  [s.id==='minsalud'?'WARN':s.id==='abc_caminos'?'UNKNOWN':'OK','Estructura',s.id==='minsalud'?'El selector no encontró la lista de comunicados':s.id==='abc_caminos'?'No evaluable':'Campos extraídos: título, fecha, enlace'],
  [s.items?'OK':(st==='OK'?'OK':'WARN'),'Novedad',s.items?`${s.items} elemento(s) nuevo(s)`:'Sin elementos nuevos']
 ];
}

function recheck(id,quiet){
 const s=src(id);if(!s||s.estado==='MANT')return;
 let ns=s.estado;
 if(s.id==='abc_caminos') ns=Math.random()<.35?'OK':'CRIT';
 else if(s.id==='minsalud') ns=Math.random()<.3?'OK':'WARN';
 else if(s.id==='minturismo') ns=Math.random()<.5?'OK':'WARN';
 else if(s.estado==='OK') ns=Math.random()<.06?'WARN':'OK';
 else if(s.estado==='UNKNOWN') ns='UNKNOWN';
 else ns='OK';
 s.hist=[...s.hist.slice(1),ns];s.last=0;
 if(ns==='OK'&&s.lat) s.lat=Math.round(500+Math.random()*1800);
 if(ns!==s.estado){
  EVENTS.unshift({t:0,k:ns,w:`${s.nombre.split(' ·')[0]} pasó a ${STATE_TXT[ns]}`,d:ns==='OK'?'Recuperada · vuelve a aportar datos':'Revisar comprobaciones'});
  s.estado=ns;s.desde=0;s.ack=false;
  if(ns==='OK') s.info=s.id==='abc_caminos'?'HTTP 200 en 6,1 s · 2 tramos con restricción':s.id==='minsalud'?'HTTP 200 · 1 comunicado nuevo':s.id==='minturismo'?'HTTP 200 en 2,3 s · 1 nota nueva':s.info;
  if(ns==='WARN'&&s.id!=='minsalud') s.info='Respuesta lenta (> 5 s) · reintentando';
  if(!quiet) toast(`${s.nombre.split(' ·')[0]}: ${STATE_TXT[ns]}`);
 } else {
  EVENTS.unshift({t:0,k:ns,w:`${s.nombre.split(' ·')[0]} · comprobación`,d:s.info});
  if(!quiet) toast(`Comprobada: ${STATE_TXT[ns]}`);
 }
 EVENTS=EVENTS.slice(0,40);
}

 const sample=await getSample();

function evalCard(r,withAdd){
 const nat=['oportunidad','riesgo','mixta'].includes(r.naturaleza)?r.naturaleza:'mixta';
 window.__lastEval=r;
 return `<div style="display:flex;gap:6px;flex-wrap:wrap">${natPill(nat)}<span class="tag">${esc(CATS[r.categoria]||r.categoria||'—')}</span>${(r.departamentos||[]).map(d=>`<span class="tag">${esc(d)}</span>`).join('')}</div><h3>${esc(r.titulo||'Noticia evaluada')}</h3>
 <div class="eval"><div><small>Relevancia</small><b>${esc(r.relevancia??'—')}/10</b></div><div><small>Novedad</small><b>${esc(r.novedad??'—')}/10</b></div><div><small>Confianza</small><b>${r.confianza!=null?Math.round(r.confianza*100)+'%':'—'}</b></div></div>

function md(t){
 const lines=esc(t).split('\n');let html='',inList=false;
 for(const l of lines){
  const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(/^#{1,4}\s/.test(l)){if(inList){html+='</ul>';inList=false}html+=`<h4>${b.replace(/^#{1,4}\s/,'')}</h4>`}
  else if(/^\s*[-*•]\s/.test(l)){if(!inList){html+='<ul>';inList=true}html+=`<li>${b.replace(/^\s*[-*•]\s/,'')}</li>`}
  else{if(inList){html+='</ul>';inList=false}html+=b?`<p style="margin:0 0 8px">${b}</p>`:''}
 }
 if(inList)html+='</ul>';return `<div style="white-space:normal">${html}</div>`;
}
function localAnalysis(){
 const a=S.analysis;
 if(a.type==='noticia'){
  const t=norm(a.text);
  const has=w=>w.some(x=>t.includes(x));
  const cat=has(['lluvia','granizo','helada','senamhi','incendio','humo','inunda'])?'clima':has(['dengue','salud','epidem','brote'])?'salud':has(['carretera','bloqueo','abc','tramo'])?'vial':has(['vuelo','aerolinea','aeropuerto','ruta aerea'])?'conectividad':has(['convocatoria','fondo','licitacion','financ'])?'financiacion':has(['festival','feria','evento'])?'eventos':has(['decreto','ley','norma'])?'normativa':'mercado';
  const risk=has(['alerta','riesgo','bloqueo','cierre','brote','corte','emergencia']),opp=has(['convocatoria','fondo','nueva','festival','feria','crece','aumento','ruta']);
  const deps=DEPS.filter(d=>t.includes(norm(d)));
  return `<p class="note">Análisis local por palabras clave (sin IA). Con AVIA la evaluación es mucho más fina.</p>`+evalCard({naturaleza:risk&&opp?'mixta':risk?'riesgo':'oportunidad',categoria:cat,departamentos:deps.length?deps:['Por confirmar'],titulo:a.text.slice(0,90)+(a.text.length>90?'…':''),relevancia:Math.min(10,4+deps.length*2+(risk||opp?2:0)),novedad:6,confianza:.4,importancia:`Clasificada como ${CATS[cat].toLowerCase()} por las palabras del texto. Falta corroborar con una fuente oficial.`,acciones:['Buscar una segunda fuente independiente','Revisar si afecta a un destino con visitantes en los próximos 7 días','Decidir si pasa a verificación'],verificar:'Comparar con la fuente oficial del canal correspondiente.'},true);
 }
 const l=anSignals();const o=l.filter(s=>s.naturaleza!=='riesgo'),r=l.filter(s=>s.naturaleza==='riesgo');
 const top=[...o].sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,3),tr=[...r].sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,3);
 const byDep=DEPS.map(d=>[d,l.filter(s=>s.deps.includes(d)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
 return `<p class="note">Análisis local calculado con reglas (sin IA). Abre esta página en Claude para que lo haga AVIA.</p>
 <h4>Resumen</h4><p>${l.length} señales en ${a.dep==='all'?'todo Bolivia':a.dep}: ${o.length} oportunidades o mixtas y ${r.length} riesgos.</p>
 ${top.length?`<h4>Oportunidades con mejor puntuación</h4><ul>${top.map(s=>`<li><b>${s.id}</b> · ${esc(s.titulo)}${s.plazo?` (${s.plazo} días)`:''} → ${esc(s.soluciones[0].t)}</li>`).join('')}</ul>`:''}
 ${tr.length?`<h4>Riesgos a vigilar</h4><ul>${tr.map(s=>`<li><b>${s.id}</b> · ${esc(s.titulo)} → ${esc(s.soluciones[0].t)}</li>`).join('')}</ul>`:''}
 ${byDep.length?`<h4>Territorios con más señales</h4><p>${byDep.slice(0,4).map(([d,n])=>`${d} (${n})`).join(', ')}.</p>`:''}
 ${a.type==='cruce'?`<h4>Cruces detectados</h4><ul>${crossings(l).map(x=>`<li>${x}</li>`).join('')||'<li>No hay riesgo y oportunidad en el mismo destino.</li>'}</ul>`:''}`;
}
function crossings(l){const res=[];l.filter(s=>s.naturaleza==='riesgo').forEach(r=>{l.filter(s=>s.naturaleza!=='riesgo').forEach(o=>{const d=r.deps.filter(x=>o.deps.includes(x));if(d.length)res.push(`${d.join(', ')}: <b>${r.id}</b> (riesgo) se cruza con <b>${o.id}</b> (${o.naturaleza})`)})});return res.slice(0,6)}

 busy=true;$('chatSend').disabled=true;
 const bubble=addMsg('a','Pensando…');
 if(!sample){setTimeout(()=>{const r=localReply(txt);bubble.textContent=r.text;if(r.act){const a=document.createElement('span');a.className='act';a.textContent=r.act;bubble.appendChild(a)}busy=false;$('chatSend').disabled=false;$('chatLog').scrollTop=1e9},350);return}
 S.turns.push({role:'user',content:txt});
 chatCtl=new AbortController();const acts=[];
 const tools=TOOLS.map(t=>({...t,execute:(i)=>{acts.push(t.name);bubble.textContent='Consultando '+t.name.replace('_',' ')+'…';return t.execute(i)}}));
 try{
  const {text}=await sample([{role:'user',content:RULES.replace('{ROL}',roleName())},{role:'assistant',content:'Entendido. Usaré las herramientas y responderé en español claro.'},...S.turns.slice(-10)],{cache:false,signal:chatCtl.signal,tools,modelTier:'quick',onText:({text})=>{bubble.textContent=text;$('chatLog').scrollTop=1e9}});
  bubble.textContent=text;S.turns.push({role:'assistant',content:text});
  if(acts.length){const a=document.createElement('span');a.className='act';a.textContent='Usó: '+[...new Set(acts)].join(', ');bubble.appendChild(a)}
 }catch(e){
  S.turns.pop();
  if(e&&e.code==='not_granted'){sampleFn=null;updateChatMode();const r=localReply(txt);bubble.textContent='(Sin permiso para usar la IA; respondo en modo local.)\n\n'+r.text}
  else if(e&&e.code==='cancelled'){bubble.textContent=e.text||'Detenido.'}
  else{bubble.textContent=(e&&e.text)||('No pude responder ahora ('+(e&&e.code||'error')+'). Prueba otra vez en un momento.')}
 }finally{busy=false;$('chatSend').disabled=false;$('chatLog').scrollTop=1e9}
}
function localReply(q){
 const t=norm(q);
 const panelHit=Object.entries(PANELS).find(([k,p])=>t.includes(norm(p.t))||t.includes(k)||(k==='mapa'&&t.includes('mapa'))||(k==='evolucion'&&t.includes('grafic'))||(k==='temas'&&t.includes('tema'))||(k==='actividad'&&t.includes('actividad')));
 if(/(anade|agrega|pon|muestra|añade)/.test(t)&&panelHit){if(S.layout.some(p=>p.id===panelHit[0])){go('panorama');return {text:`«${panelHit[1].t}» ya está en el tablero. Te llevé al Panorama.`}}addPanel(panelHit[0],true);return {text:`Listo, añadí «${panelHit[1].t}» al tablero.`,act:'Tablero actualizado'}}
 if(/(quita|elimina|saca|oculta)/.test(t)&&panelHit){removePanel(panelHit[0],true);return {text:`Quité «${panelHit[1].t}». Puedes volver a ponerlo cuando quieras.`,act:'Tablero actualizado'}}
 if(/fuente|falla|caid|estado/.test(t)){const bad=SOURCES.filter(s=>['WARN','CRIT','UNKNOWN'].includes(s.estado));go('fuentes');return {text:bad.length?`Hay ${bad.length} fuentes que revisar:\n`+bad.map(s=>`• ${s.nombre}: ${STATE_TXT[s.estado]} — ${s.info}`).join('\n'):'Todas las fuentes están bien.',act:'Abrí la vista Fuentes'}}
 const dep=DEPS.find(d=>t.includes(norm(d)));
 if(/riesgo|peligro|alerta/.test(t)){const l=active().filter(s=>s.naturaleza==='riesgo'&&(!dep||s.deps.includes(dep)));return {text:l.length?`Riesgos${dep?' en '+dep:''}:\n`+l.map(s=>`• ${s.id} ${s.titulo} (${STL[s.estado]}). Verificar: ${s.soluciones[0].t.toLowerCase()}.`).join('\n'):`No hay riesgos activos${dep?' en '+dep:''}.`}}
 if(/oportunidad|plazo|cierra|fondo|convocatoria/.test(t)){const l=active().filter(s=>s.naturaleza!=='riesgo'&&(!dep||s.deps.includes(dep))).sort((a,b)=>(a.plazo??999)-(b.plazo??999)).slice(0,4);return {text:l.length?'Oportunidades por plazo:\n'+l.map(s=>`• ${s.id} ${s.titulo}${s.plazo?` — ${s.plazo} días`:''}. Siguiente paso: ${s.soluciones[0].t.toLowerCase()}.`).join('\n'):'No encontré oportunidades con ese filtro.'}}
 if(/resumen|sintesis|ministerio|informe/.test(t)){const a=active();return {text:`Resumen (datos de ejemplo): ${a.length} señales activas. Lo más urgente es la alerta naranja en Yungas y Rurrenabaque (SEN-0418). Las mejores oportunidades son el fondo de CAF para turismo comunitario, que cierra en 12 días (SEN-0417), y la nueva frecuencia aérea a Santa Cruz (SEN-0413). Falta confirmar la señal de dengue con el Ministerio de Salud (SEN-0415).`}}
 const m=q.match(/SEN-\d{4}/i);if(m&&sig(m[0].toUpperCase())){const s=sig(m[0].toUpperCase());openSignal(s.id);return {text:`${s.id}: ${s.titulo}. ${s.importancia}`,act:'Abrí la señal'}}
 if(dep){const l=active().filter(s=>s.deps.includes(dep));return {text:`${dep} tiene ${l.length} señales:\n`+l.map(s=>`• ${s.id} ${s.titulo} (${s.naturaleza})`).join('\n')}}
 return {text:'En modo local entiendo preguntas sobre oportunidades, riesgos, fuentes, un departamento o un código SEN, y órdenes como «añade el mapa» o «quita la actividad». Con la IA activa puedo hacer análisis más abiertos.'};
}
/* Mover el asistente flotante */
(function(){let sx,sy,ox,oy,drag=false;const ch=$('chat'),hd=$('chatHead');
 hd.addEventListener('pointerdown',e=>{if(e.target.closest('button')||S.docked)return;drag=true;const r=ch.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;hd.setPointerCapture(e.pointerId)});
 hd.addEventListener('pointermove',e=>{if(!drag)return;const x=Math.max(0,Math.min(innerWidth-ch.offsetWidth,ox+e.clientX-sx)),y=Math.max(0,Math.min(innerHeight-60,oy+e.clientY-sy));ch.style.left=x+'px';ch.style.top=y+'px';ch.style.right='auto';ch.style.bottom='auto';ch.style.height=Math.min(640,innerHeight-y-16)+'px'});
 hd.addEventListener('pointerup',()=>{drag=false});
})();

/* ───────── Simulación en vivo ───────── */
let liveTimer=null,tick=0;
function liveStep(){
 tick++;
 EVENTS.forEach(e=>e.t-=0.33);SOURCES.forEach(s=>{s.last=(s.last??((s.freq*.4)|0))+.33;s.desde+=.33});SIGNALS.forEach(s=>{s.min+=.33;if(s.sla)s.sla=Math.max(1,s.sla-0.33|0)});
 const cand=SOURCES.filter(s=>s.estado!=='MANT'&&s.estado!=='UNKNOWN');recheck(cand[Math.floor(Math.random()*cand.length)].id,true);
 if(tick%3===0&&PENDING.length){const n=PENDING.shift();n.min=0;SIGNALS.unshift(n);EVENTS.unshift({t:0,k:'spark',w:'AVIA detectó una señal nueva',d:`${n.id} · ${n.titulo}`});toast(`Nueva señal: ${n.titulo}`)}
 renderNav();
 if(!document.querySelector('.drawer:not([hidden])')&&!S.editing&&!document.activeElement?.matches('input,textarea,select')&&S.view!=='analisis'){const y=scrollY;render();scrollTo(0,y)}
}
function setLive(on){S.live=on;clearInterval(liveTimer);if(on)liveTimer=setInterval(liveStep,20000);$('liveBtn').className='pill hide-sm '+(on?'st-OK live':'st-UNKNOWN');$('liveTxt').textContent=on?'Simulación activa':'Simulación en pausa'}

/* ───────── Eventos ───────── */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-src],[data-sig]');if(!t)return;
 const D=t.dataset;
 if(D.view) return go(D.view);
 if(D.preset) return applyPreset(D.preset);
 if(D.pmove) return movePanel(D.id,+D.pmove);
 if(D.pwide) return widenPanel(D.pwide);
 if(D.premove) return removePanel(D.premove);
 if(D.add){if(!S.layout.some(p=>p.id===D.add)){addPanel(D.add);closeDrawer()}return}
 if(D.dep){S.sigFilter={nat:'all',dep:D.dep,q:''};return go('senales')}
 if(D.move) return moveSignal(D.move,D.to);
 if(D.decide){const note=$('decNote')?.value.trim();const sel=document.querySelector('input[name="sol"]:checked');const s=sig(D.decide);const n=(sel?'Acción: '+s.soluciones[+sel.value].t+'. ':'')+(note||'');closeDrawer();return moveSignal(D.decide,D.to,n.trim())}
 if(D.askabout){closeDrawer();const s=sig(D.askabout);return openChat(`Dame un plan de acción para ${s.id} (${s.titulo}). ¿Quién puede aprovecharlo o a quién afecta y qué hago primero?`)}
 if(D.recheck){recheck(D.recheck);renderNav();openSource(D.recheck);if(S.view!=='panorama'||!S.editing)render();return}
 if(D.ack){const s=src(D.ack);s.ack=true;EVENTS.unshift({t:0,k:'check',w:`${roleName()} reconoció el problema en ${s.nombre.split(' ·')[0]}`,d:s.info});toast('Problema reconocido.');openSource(D.ack);render();return}
 if(D.mant){const s=src(D.mant);if(s.estado==='MANT'){s.estado='UNKNOWN';s.info='Pendiente de la primera comprobación'}else{s.estado='MANT';s.info='Mantenimiento programado por el administrador'}s.desde=0;renderNav();openSource(D.mant);render();return}
 if(D.sf){S.srcFilter=D.sf===S.srcFilter&&D.sf!=='all'?'all':D.sf;return render()}
 if(D.nat){S.sigFilter.nat=D.nat;return render()}
 if(D.antype){S.analysis.type=D.antype;return render()}
 if(D.anscope){S.analysis.scope=D.anscope;return render()}
 if(D.sr!==undefined){const r=window.__sr[+D.sr];closeSearch();return r&&r.a()}
 if(D.chip){$('chatIn').value=D.chip;return sendChat()}
 if(D.themeSet!==undefined){S.theme=D.themeSet||null;store.set('theme',S.theme);if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');return openA11y()}
 if(D.fs){S.fs=+D.fs;store.set('fs',S.fs);applyPrefs();return openA11y()}
 if(D.contrast){S.contrast=D.contrast;store.set('contrast',S.contrast);applyPrefs();return openA11y()}
 if(D.simple!==undefined){S.simple=D.simple==='1';store.set('simple',S.simple);applyPrefs();render();return openA11y()}
 if(D.src&&!t.matches('button[data-recheck]')) return openSource(D.src);
 if(D.sig) return openSignal(D.sig);
 switch(D.act){
  case 'edit': S.editing=!S.editing; return render();
  case 'catalog': return openCatalog();
  case 'close': return closeDrawer();
  case 'resetview': return applyPreset(S.preset.startsWith('c:')?'ejecutivo':S.preset);
  case 'saveview': return openDrawer(`<div class="drawer-h">${ico('save')} Guardar tablero<button class="icon-btn" data-act="close" aria-label="Cerrar">${ico('close')}</button></div><div class="drawer-b"><form id="saveForm" class="field"><label for="saveName">Nombre del tablero</label><input class="inp" id="saveName" maxlength="30" placeholder="Por ejemplo: Mi semana" required><button class="btn gold" style="margin-top:8px;align-self:flex-start">${ico('save')} Guardar</button></form><p class="note">Aparecerá en «Tableros guardados». Se guarda solo en este navegador.</p></div>`);
  case 'brief': return openChat('Haz el resumen del día para el equipo de supervisión turística: lo urgente, las 3 mejores oportunidades y qué falta verificar.');
  case 'oppbrief': return openChat('Mirando todas las señales, ¿qué oportunidades nuevas propones que todavía no estén planteadas? Combina señales cuando tenga sentido.');
  case 'checkall': SOURCES.forEach(s=>recheck(s.id,true));renderNav();render();return toast('Se comprobaron todas las fuentes.');
  case 'addsrc': return openDrawer(`<div class="drawer-h">${ico('plus')} Añadir fuente<button class="icon-btn" data-act="close" aria-label="Cerrar">${ico('close')}</button></div><div class="drawer-b"><form id="srcForm" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="nsN">Nombre</label><input class="inp" id="nsN" required placeholder="Por ejemplo: Viceministerio de Defensa Civil"></div><div class="field"><label for="nsU">Dirección web</label><input class="inp" id="nsU" type="url" required placeholder="https://"></div><div class="field"><label for="nsC">Canal</label><select id="nsC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label for="nsF">Comprobar cada</label><select id="nsF"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="360">6 horas</option><option value="1440">1 día</option></select></div><button class="btn gold" style="align-self:flex-start">${ico('plus')} Añadir</button></form><p class="note">La fuente entra como DESCONOCIDO hasta su primera comprobación. En la versión real se añade al catálogo de AVIA y a la tabla de fuentes.</p></div>`);
  case 'runan': return runAnalysis();
  case 'stopan': return anCtl&&anCtl.abort();
  case 'addeval':{const r=window.__lastEval;if(!r)return;const id='SEN-'+String(422+SIGNALS.length).padStart(4,'0');SIGNALS.unshift({id,titulo:r.titulo||'Noticia evaluada',resumen:'Añadida desde Análisis.',naturaleza:['oportunidad','riesgo','mixta'].includes(r.naturaleza)?r.naturaleza:'mixta',categoria:CATS[r.categoria]?r.categoria:'mercado',deps:(r.departamentos||[]).filter(d=>DEPS.includes(d)),destinos:r.destinos||[],estado:'detectada',prioridad:'media',rel:+r.relevancia||5,nov:+r.novedad||5,conf:+r.confianza||.5,fuentes:[],corr:0,min:0,importancia:r.importancia||'',soluciones:(r.acciones||['Verificar']).map(x=>({t:x,d:''}))});renderNav();return toast(`${id} añadida como detectada.`)}
 }
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='chatForm') return sendChat();
 if(e.target.id==='saveForm'){const n=$('saveName').value.trim();if(!n)return;S.custom[n]=S.layout.map(p=>({...p}));store.set('custom',S.custom);S.preset='c:'+n;saveLayout();closeDrawer();renderNav();return toast(`Tablero «${n}» guardado.`)}
 if(e.target.id==='srcForm'){const id='nueva_'+Date.now().toString(36);SOURCES.push({id,nombre:$('nsN').value.trim(),canal:$('nsC').value,tipo:'nueva',url:$('nsU').value.trim(),metodo:'Por definir',freq:+$('nsF').value,estado:'UNKNOWN',info:'Pendiente de la primera comprobación',lat:null,items:0,desde:0,hist:h24('uuuuuuuuuuuuuuuuuuuuuuuu'),verif:'por confirmar'});EVENTS.unshift({t:0,k:'UNKNOWN',w:'Fuente añadida',d:$('nsN').value.trim()});closeDrawer();renderNav();render();return toast('Fuente añadida. Pulsa «Comprobar ahora» para probarla.')}
});
document.addEventListener('input',e=>{
 if(e.target.id==='srcQ'){S.srcQ=e.target.value;const p=e.target.selectionStart;render();const i=$('srcQ');i.focus();i.setSelectionRange(p,p)}
 if(e.target.id==='sigQ'){S.sigFilter.q=e.target.value;const p=e.target.selectionStart;render();const i=$('sigQ');i.focus();i.setSelectionRange(p,p)}
 if(e.target.id==='searchIn') renderSearch();
 if(e.target.id==='chatIn'){e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'}
});
document.addEventListener('change',e=>{
 if(e.target.id==='sigDep'){S.sigFilter.dep=e.target.value;render()}
 if(e.target.id==='anDep'){S.analysis.dep=e.target.value;render()}
 if(e.target.id==='role'){S.role=e.target.value;store.set('role',S.role);render();toast(`Ahora entras como ${roleName()}.`)}
});
document.addEventListener('keydown',e=>{
 const typing=e.target.matches('input,textarea,select');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return openSearch()}
 if(e.key==='Escape'){if(!$('search').hidden)return closeSearch();if(!$('drawer').hidden)return closeDrawer();if(S.chatOpen)return closeChat();if(S.editing){S.editing=false;return render()}}
 if(!$('search').hidden&&e.key==='Enter'){const r=window.__sr&&window.__sr[0];if(r){closeSearch();r.a()}return}
 if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();return sendChat()}
 if(e.target.matches('tr[data-src]')&&e.key==='Enter') return openSource(e.target.dataset.src);
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='h'||e.key==='H'){e.preventDefault();S.chatOpen?$('chatIn').focus():openChat()}
 if((e.key==='e'||e.key==='E')&&S.view==='panorama'){S.editing=!S.editing;render()}
});
$('scrim').onclick=closeDrawer;
$('search').addEventListener('click',e=>{if(e.target.id==='search')closeSearch()});
$('searchBtn').onclick=openSearch;
$('healthBtn').onclick=()=>go('fuentes');
$('liveBtn').onclick=()=>setLive(!S.live);
$('fontUp').onclick=()=>{S.fs=Math.min(1.3,Math.round((S.fs+.1)*100)/100);store.set('fs',S.fs);applyPrefs()};
$('fontDown').onclick=()=>{S.fs=Math.max(.85,Math.round((S.fs-.1)*100)/100);store.set('fs',S.fs);applyPrefs()};
$('a11yBtn').onclick=openA11y;
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
$('chatFab').onclick=()=>openChat();
$('chatClose').onclick=closeChat;
$('chatClear').onclick=()=>{S.turns=[];$('chatLog').innerHTML='';chatCtl&&chatCtl.abort();openChat()};
$('chatDock').onclick=()=>{S.docked=!S.docked;store.set('docked',S.docked);const c=$('chat');c.style.left=c.style.top=c.style.height='';c.style.right=c.style.bottom='';c.classList.toggle('docked',S.docked)};
$('role').value=S.role;

applyPrefs();renderNav();render();setLive(true);getSample();
})();
