          [Gaceta, edición 1950NEC, 2026-11-07] Decreto Supremo N° 5590 · Declara feriado con suspensión de actividades el lunes 17 de noviembre de 2026 en el departamento de Potosí por aniversario departamental.
        salida:
          titulo: "Feriado en Potosí el lunes 17 de noviembre (DS 5590): fin de semana largo"
          resumen: "El Decreto Supremo N° 5590, publicado el 7 de noviembre de 2026, declara feriado el lunes 17 de noviembre en Potosí, lo que genera un fin de semana largo."
          recomendacion: "Hoteles y operadores de Potosí y Uyuni: anticipar demanda y promociones de fin de semana largo."
          naturaleza: oportunidad
          categoria: mercados
          prioridad: alta
          motivos_prioridad: [evento_alto_impacto_fecha_proxima]
          departamentos: [Potosí]
          fecha_evento_inicio: "2026-11-15T00:00:00-04:00"
          fecha_evento_fin: "2026-11-17T23:59:00-04:00"
          fuente_oficial: true
          enlace_oficial: http://www.gacetaoficialdebolivia.gob.bo/normas/listadofec
          requiere_revision: false
          es_escenario: false
          confianza: 0.95

