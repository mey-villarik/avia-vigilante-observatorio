    tipo: oficial
    url: http://www.gacetaoficialdebolivia.gob.bo/normas/buscar
    url_verificacion: encontrada_no_abierta   # ⚠️ NO VERIFICADA: aparece en buscador; el sitio bloquea lectores automáticos (robots). Solo http.
    urls_secundarias:
      - url: http://www.gacetaoficialdebolivia.gob.bo/normas/listadofec
        uso: listado de normas por fecha de publicación (la mejor entrada para vigilar novedades)
        url_verificacion: encontrada_no_abierta
    acceso:
      metodo: http_html
      alternativa: apify
      extraer: "tipo de norma, número, fecha, número de edición, resumen; enlace a la norma (verGratis)"
    frecuencia_minutos: 1440
    que_buscar:
      - decretos supremos, leyes y resoluciones que mencionen turismo, feriados, áreas protegidas, patrimonio, transporte, migración/visas, aeropuertos, emergencias o declaratorias de desastre
    palabras_clave: [turismo, turístico, feriado, descanso, área protegida, parque nacional, patrimonio, visa, migración, aeropuerto, aerolínea, transporte interdepartamental, emergencia, desastre, declaratoria, tasa, tributo, régimen tributario, incentivo]
    categoria: mercados
    naturaleza_por_defecto: mixta
    severidad:
      alta: "Norma que cambia ingreso de turistas (visas, requisitos), declara emergencia o desastre en zona turística, o fija feriado en ≤ 15 días"
      media: "Incentivo, tasa o reglamento que afecta a operadores turísticos"
      baja: "Norma con mención tangencial al turismo"
    requiere_aprobacion: false     # normativa oficial; si declara emergencia/desastre pasa a categoria clima o seguridad → revisión obligatoria
    verificacion_fidelidad:
      - "Citar tipo, número y fecha exactos de la norma (p. ej. 'Decreto Supremo N° 5521')."
      - "Resumir solo lo que dice el texto; no interpretar efectos jurídicos más allá de lo literal."
      - "Si solo se tiene el resumen y no el texto, decirlo."
    ejemplos:
